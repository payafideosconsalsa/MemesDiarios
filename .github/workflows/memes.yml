
name: Memes diarios

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar meme
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py

      - name: Guardar historial
        run: |
          git config user.name "MemesDiarios"
          git config user.email "bot@users.noreply.github.com"
          git add publicados.json
          git diff --cached --quiet || git commit -m "Actualizar memes publicados"
          git push
